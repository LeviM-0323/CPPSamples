name: Linux C++ Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Generate release timestamp
        id: timestamp
        shell: bash
        run: |
          timestamp=$(date +'%Y-%m-%d %H:%M')
          echo "timestamp=$timestamp" >> $GITHUB_OUTPUT
          tag=$(date +'build-%Y-%m-%d-%H%M')
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Build projects
        shell: bash
        run: |
          set -euo pipefail

          staging_dir="$RUNNER_TEMP/linux"
          mkdir -p "$staging_dir"

          find . -name '*.vcxproj' -print0 | while IFS= read -r -d '' project_file; do
            project_dir="$(dirname "$project_file")"
            project_name="$(grep -oPm1 '(?<=<ProjectName>)[^<]+' "$project_file" || true)"

            if [[ -z "$project_name" ]]; then
              project_name="$(basename "$project_dir")"
            fi

            mapfile -t source_files < <(find "$project_dir" -maxdepth 1 -name '*.cpp' | sort)

            if [[ "${#source_files[@]}" -eq 0 ]]; then
              echo "No C++ sources found in $project_dir"
              exit 1
            fi

            g++ -std=c++17 -O2 -pthread "${source_files[@]}" -o "$staging_dir/$project_name"
          done

      - name: Upload Linux release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.timestamp.outputs.tag }}
          name: Build ${{ steps.timestamp.outputs.timestamp }}
          files: |
            ${{ runner.temp }}/linux/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
