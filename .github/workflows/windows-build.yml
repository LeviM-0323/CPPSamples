name: Windows C++ Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build projects
        shell: pwsh
        run: |
          $stagingDir = Join-Path $env:RUNNER_TEMP 'windows'
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          & msbuild .\CppSamples.sln /p:Configuration=Release /p:Platform=x64 /p:OutDir=$stagingDir /p:LanguageStandard=stdcpp17

      - name: Upload Windows release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.sha }}
          name: CI build ${{ github.sha }}
          files: |
            ${{ runner.temp }}/windows/*.exe
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
